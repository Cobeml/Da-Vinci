name: Python package and workspace
on: [push, pull_request]
permissions:
  contents: read
jobs:
  structural-native:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra studies --frozen
      - run: uv run davinci setup --template structural
      - name: Required optional structural physics and public-driver parity
        run: uv run python scripts/required_native.py --structural
      - name: Optional structural journey from the installed wheel
        run: |
          npm ci
          npm run build:ui
          uv build --no-build-isolation
          uv venv /tmp/structural-wheel
          uv pip install --python /tmp/structural-wheel/bin/python dist/*.whl
          cd /tmp
          /tmp/structural-wheel/bin/python "$GITHUB_WORKSPACE/scripts/check_installed_structural.py"
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra studies --frozen
      - run: npm ci
      - run: npm run build:ui
      - run: uv run pytest -m 'not integration' -q
      - run: npm run build
      - run: uv build --no-build-isolation
      - name: Check wheel in a fresh environment
        run: |
          uv venv /tmp/wheel-check
          uv pip install --python /tmp/wheel-check/bin/python dist/*.whl
          cd /tmp
          /tmp/wheel-check/bin/davinci external adapters
          /tmp/wheel-check/bin/davinci external schemas
          /tmp/wheel-check/bin/davinci init installed-example --template custom
          /tmp/wheel-check/bin/davinci --workspace installed-example validate installed-example/run.yaml
          /tmp/wheel-check/bin/python "$GITHUB_WORKSPACE/scripts/check_external_install.py" /tmp/wheel-check/lib/python3.11/site-packages
      - uses: actions/upload-artifact@v4
        with:
          name: da-vinci-package
          path: dist/*
  cad-and-browser:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: astral-sh/setup-uv@v6
      - run: uv sync --extra studies --frozen
      - run: npm ci
      - run: npm run build:ui
      - run: npx playwright install --with-deps chromium
      - run: uv run davinci setup --template vtol
      - name: Required native physics and route parity (fail if images or checks are missing)
        run: uv run python scripts/required_native.py
      - run: npm run test:product
      - name: Native parity from a freshly installed wheel outside the checkout
        run: |
          uv build --no-build-isolation
          uv venv /tmp/native-wheel-check
          uv pip install --python /tmp/native-wheel-check/bin/python dist/*.whl
          cd /tmp
          /tmp/native-wheel-check/bin/python "$GITHUB_WORKSPACE/scripts/check_installed_routes.py"
          /tmp/native-wheel-check/bin/python "$GITHUB_WORKSPACE/scripts/check_installed_tools.py"
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: workspace-browser-evidence
          path: |
            test-results/
            runtime/product-screenshots/
