[project]
name = "da-vinci-harness"
version = "0.1.0"
description = "A versioned multi-agent CAD workbench with independent evaluation"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "pydantic-settings>=2.8,<3",
  "pymongo>=4.11,<5", "openai>=1.68,<3", "cadquery>=2.5,<3",
  "numpy>=2,<3", "jsonschema>=4.23,<5", "playwright>=1.51,<2"
]

[dependency-groups]
dev = ["pytest>=8,<10", "httpx>=0.28,<1", "ruff>=0.11,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires the Docker CAD image"]

[tool.ruff]
line-length = 110
target-version = "py311"
